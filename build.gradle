plugins {
    id 'java-library'
    id 'idea'
    id 'fabric-loom' version "${loom_version}"
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id
base.archivesName = 'ProjectExpansionNeo'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven2.bai.lol' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepository {
            ivy {
                name = 'ProjectEFReleases'
                url = 'https://github.com/wchiway/ProjectEF/releases/download'
                patternLayout {
                    artifact "[revision]/[artifact]-${minecraft_version}-PE[revision](-[classifier]).[ext]"
                }
                metadataSources { artifact() }
            }
        }
        filter { includeModule('com.github.wchiway', 'ProjectEF') }
    }
}

// Local builds are opt-in; the default dependency comes from GitHub Releases.
def projectefJarOverride = providers.gradleProperty('projectef_jar').orNull
if (projectefJarOverride != null && !file(projectefJarOverride).isFile()) {
    throw new GradleException("The supplied -Pprojectef_jar does not exist: ${projectefJarOverride}")
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip"
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    if (projectefJarOverride != null) {
        modImplementation files(file(projectefJarOverride))
    } else {
        modImplementation "com.github.wchiway:ProjectEF:${projectef_version}"
    }
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${fcap_version}"
    modImplementation "me.lucko:fabric-permissions-api:${permissions_api_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Loom's development remap does not expose libraries nested inside the ProjectEF JAR.
    runtimeOnly 'org.apache.commons:commons-math3:3.6.1'
    runtimeOnly 'com.github.Towdium:PinIn:1.6.0'

    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}+${minecraft_version}:api"
    modCompileOnly "maven.modrinth:jade:${jade_version}"
    modCompileOnly "mcp.mobius.waila:wthit-api:fabric-${wthit_version}"
    modCompileOnly "maven.modrinth:trinkets:${trinkets_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cca_version}"
    if (recipe_viewer == 'jei') {
        modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    } else if (recipe_viewer == 'emi') {
        modLocalRuntime "dev.emi:emi-fabric:${emi_version}+${minecraft_version}"
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
loom {
    accessWidenerPath = file('src/main/resources/projectexpansion.accesswidener')
    mixin.defaultRefmapName = 'projectexpansion.refmap.json'
    runs {
        client { client() }
        server {
            server()
            programArg '--nogui'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

def expandedVersion = project.version.toString()
processResources {
    inputs.property 'version', expandedVersion
    filesMatching('fabric.mod.json') { expand version: expandedVersion }
    exclude 'META-INF/accesstransformer.cfg'
    exclude '.cache/**'
}

// Generated resources are checked in; regenerate explicitly when their sources change.
tasks.register('data', Exec) {
    group = 'build'
    description = 'Regenerates resources using the TypeScript generators (requires Node.js and npm).'
    commandLine 'bash', file('scripts/generate-assets.sh').absolutePath
}

tasks.named('wrapper', Wrapper) {
    distributionUrl = 'https://mirrors.cloud.tencent.com/gradle/gradle-8.12.1-all.zip'
}

// A separate development mod runs headless integration tests and is never packaged in the release JAR.
if (providers.gradleProperty('gametest').isPresent()) {
    sourceSets {
        testmod {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            projectexpansion { sourceSet sourceSets.main }
            projectexpansion_test { sourceSet sourceSets.testmod }
        }
        runs {
            clientSmoke {
                client()
                source sourceSets.testmod
                runDir 'build/client-smoke'
                vmArg '-Dprojectexpansion.clientSmoke=true'
            }
            gameTestServer {
                server()
                source sourceSets.testmod
                runDir 'build/gametest'
                vmArg '-Dfabric-api.gametest'
                vmArg "-Dfabric-api.gametest.report-file=${file('build/gametest-results.xml').absolutePath}"
            }
        }
    }
}
